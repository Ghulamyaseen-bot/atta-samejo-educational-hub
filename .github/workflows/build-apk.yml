name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

          echo "Project files:"
          find android-project -maxdepth 3 -type f | sort | head -100

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Prepare Android project
        shell: bash
        run: |
          cd android-project

          if [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -f "build.gradle" ]; then
            echo "ERROR: build.gradle not found."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app folder not found."
            exit 1
          fi

          echo "Android project found successfully."

          # AGP 8.2.2 officially supports compileSdk up to 34.
          # Keep this CI build compatible with AGP 8.2.2.
          sed -i 's/compileSdk 35/compileSdk 34/g' app/build.gradle
          sed -i 's/targetSdk 35/targetSdk 34/g' app/build.gradle

          echo "Final Android configuration:"
          grep -E "compileSdk|targetSdk|minSdk" app/build.gradle

      - name: Build Debug APK
        shell: bash
        run: |
          cd android-project
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."
          find android-project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttaSamejo-EduHub-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Capacitor Mobile Project & Build APK
        shell: bash
        run: |
          mkdir webapp
          cd webapp
          
          # Initialize Capacitor Project
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Copy extracted web files
          cp -r ../project/* .
          
          # Generate Capacitor Config
          npx cap init "EduHub App" "com.attasamejo.eduhub" --web-dir .
          npx cap add android
          npx cap sync android

          # Build APK using Gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttaSamejo-EduHub-APK
          path: webapp/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

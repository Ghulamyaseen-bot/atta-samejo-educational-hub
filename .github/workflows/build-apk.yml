name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found!"
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        shell: bash
        run: |
          GRADLEW=$(find project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found!"
            echo "The ZIP may not contain an Android Gradle project."
            exit 1
          fi

          echo "Found Gradle wrapper: $GRADLEW"

          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"

          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttaSamejo-EduHub-APK
          path: "project/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: errorid/app/build/outputs/apk/debug/app-debug.apk
